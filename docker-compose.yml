services:
  aiservice:
    build:
      context: .
      dockerfile: AiService/Dockerfile
    ports:
      - "8090:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - pgvector    
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports: [ "11434:11434" ]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    environment:
      - POSTGRES_USER=aiuser
      - POSTGRES_PASSWORD=aiPass123
      - POSTGRES_DB=aivector
    ports: [ "5433:5432" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiuser -d aivector"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  ollama:
  pgdata:
